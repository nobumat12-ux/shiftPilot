function renderRequests(){let arr=requestsFor(),mine=arr.filter(r=>r.user===user),{days}=period(),draft=draftFor(),submitted=!!data.requestSubmissions[submissionKey()],weekOffset=new Date(days[0]+'T12:00:00').getDay();let cards=Array.from({length:weekOffset},()=>'<div></div>').join('')+days.map(d=>{let c=me().contracts[new Date(d+'T12:00:00').getDay()],r=draft[d],label=r?.type==='unavailable'?'出勤不可':r?.type==='time'?`変更 ${r.start}〜${r.end}`:r?.type==='available'?`追加可能 ${r.start}〜${r.end}`:r?.type==='none'?'契約通り':c?`${c[0]}〜${c[1]}`:'契約休';return `<button class="day ${r&&r.type!=='none'?'modified':''}" data-request-day="${d}"><span class="date">${+d.slice(-2)}（${weekday(d)}）</span><span class="hour">${esc(label)}</span>${r&&r.type!=='none'?'<span class="hint">● 希望変更</span>':''}</button>`}).join('');return `<div class="toolbar"><input type="month" id="month" value="${month}"><span class="pill ${submitted?'good':'warn'}">${submitted?'提出済み':'未提出'}</span></div><div class="card"><h2>自分の希望提出カレンダー</h2><p class="help">週契約があらかじめ反映されています。変更したい日をタップし、最後に「今月の希望を提出」を押してください。提出後も再編集できます。</p><div class="calendar">${['日','月','火','水','木','金','土'].map(x=>`<div class="dayheading">${x}</div>`).join('')}${cards}</div><div class="summarystrip"><span class="pill">契約を初期表示</span><span class="pill bad">赤：変更した希望</span></div><div class="row noprint"><button class="btn" id="save-request-draft">下書き保存</button><button class="btn primary" id="submit-month-request">${submitted?'変更して再提出':'今月の希望を提出'}</button></div><p class="help">入力中はこの端末に自動保持されます。正式提出後に管理者が確認できます。</p></div><div class="card" style="margin-top:15px"><h2>提出状況</h2><div class="list">${data.users.map(u=>{let done=!!data.requestSubmissions[submissionKey(month,u.id)]||arr.some(r=>r.user===u.id);return `<div class="item"><span>${esc(u.name)}</span><span class="pill ${done?'good':'warn'}">${done?'提出済み':'未提出'}</span></div>`}).join('')}</div></div>${admin()?`<div class="card" style="margin-top:15px"><h2>提出された希望（管理者用）</h2><div class="list">${arr.sl function editRequestDay(d){let c=me().contracts[new Date(d+'T12:00:00').getDay()],r=draftFor()[d];showModal(`${fmt(d)}（${weekday(d)}）の希望`,`<p class="boxnote">契約：${c?c[0]+'〜'+c[1]+' / 休憩'+c[2]+'分':'契約休'}</p><div class="formgrid"><label class="field full">希望区分<select id="r-type"><option value="none" ${!r||r.type==='none'?'selected':''}>契約通り（希望変更なし）</option><option value="unavailable" ${r?.type==='unavailable'?'selected':''}>出勤不可</option><option value="time" ${r?.type==='time'?'selected':''}>勤務時間を変更したい</option><option value="available" ${r?.type==='available'?'selected':''}>追加勤務可能</option></select></label><label class="field">希望開始<input type="time" id="r-start" value="${r?.start||c?.[0]||'17:00'}"></label><label class="field">希望終了<input type="time" id="r-end" value="${r?.end||c?.[1]||'23:00'}"></label></div>`,'<button class="btn primary" id="save-request-day">この日の希望を保存</button>');$('#save-request-day').onclick=()=>{let type=$('#r-type').value,start=$('#r-start').value,end=$('#r-end').value;if(['time','available'].includes(type)&&(!start||!end||start>=end)){alert('希望時間を確認してください');return}let key=submissionKey();data.requestDrafts[key]??={};if(type==='none')delete data.requestDrafts[key][d];else data.requestDrafts[key][d]={type,start,end};save();closeModal();render()}}

const userName=id=>data.users.find(u=>u.id===id)?.name||'不明なスタッフ';
const stamp=isoString=>isoString?new Date(isoString).toLocaleString('ja-JP'):'—';
const taskTitle=t=>esc(t.title);
function normalizeTask(t){if(!t.mode)t.mode='shared';if(!Array.isArray(t.assignees))t.assignees=data.users.filter(u=>u.role==='admin').map(u=>u.id);if(!t.progress)t.progress={};if(!t.creator)t.creator='u1';return t}
function taskVisible(t){normalizeTask(t);return admin()||t.assignees.includes(user)}
function taskCanEdit(t){normalizeTask(t);return admin()||t.assignees.includes(user)}
function taskStatusFor(t,id=user){normalizeTask(t);return t.mode==='individual'?(t.progress[id]?.status||'todo'):t.status}
function visibleTasks(){return data.tasks.filter(t=>taskVisible(t))}
function pendingMine(){return visibleTasks().filter(t=>t.assignees.includes(user)&&taskStatusFor(t)!=='done')}
function taskStatusPicker(t,id,allow){let v=t.mode==='individual'?(t.progress[id]?.status||'todo'):t.status;return `<select aria-label="${esc(userName(id))}の進捗" data-task-target="${esc(t.id)}" data-assignee="${esc(id)}" ${!allow?'disabled':''}><option value="todo" ${v==='todo'?'selected':''}>☐ 未対応</option><option value="doing" ${v==='doing'?'selected':''}>◐ 対応中</option><option value="done" ${v==='done'?'selected':''}>✓ 完了</option></select>`}
function progressLabel(t){normalizeTask(t);if(t.mode==='individual'){let total=t.assignees.length,done=t.assignees.filter(id=>t.progress[id]?.status==='done').length;return `${done}/${total}人 完了`};return t.status==='done'?`完了：${esc(userName(t.doneBy))}`:t.status==='doing'?'対応中':'未対応'}

function newTaskModal(){const options=data.users.map(u=>`<label class="check-person"><input type="checkbox" class="pick-task-user" value="${u.id}" checked> ${esc(u.name)} <small>${u.role==='admin'?'管理者':'スタッフ'}</small></label>`).join('');showModal('タスクの一括作成',`<div class="formgrid"><label class="field full">タスク名<input id="task-new-title" maxlength="100" placeholder="例：新しいマニュアルを確認"></label><label class="field full">詳細（任意）<textarea id="task-new-detail" rows="3" maxlength="1000"></textarea></label><label class="field">完了方式<select id="task-new-mode"><option value="individual">各人が個別に完了</option><option value="shared">誰か1人が完了すれば終了</option></select></label><label class="field">期限（任意）<input id="task-new-deadline" type="date"></label></div><h3>対象者 <button class="btn small" id="task-select-all">全員選択</button> <button class="btn small" id="task-select-none">すべて解除</button></h3><div class="people-grid">${options}</div>`, '<button class="btn primary" id="task-create">対象者に作成</button>');$('#task-select-all').onclick=()=>$$('.pick-task-user').forEach(e=>e.checked=true);$('#task-select-none').onclick=()=>$$('.pick-task-user').forEach(e=>e.checked=false);$('#task-create').onclick=()=>{let title=$('#task-new-title').value.trim(),assignees=$$('.pick-task-user:checked').map(e=>e.value);if(!title||!assignees.length){alert('タスク名と対象者を入力してください。');return}let t={id:uid(),title,description:$('#task-new-detail').value.trim(),mode:$('#task-new-mode').value,deadline:$('#task-new-deadline').value,assignees,progress:{},creator:user,type:'manual',related:'',month,status:'todo',owner:'',doneBy:'',doneAt:'',createdAt:new Date().toISOString()};data.tasks.push(t);log('タスク作成',title+'（'+assignees.length+'人）');save();closeModal();render()}}
function updateTask(id,person,status){let t=data.tasks.find(x=>x.id===id);if(!t)return;normalizeTask(t);if(!admin()&&!t.assignees.includes(user))return;if(!admin()&&person!==user)return;const now=new Date().toISOString();if(t.mode==='individual'){t.progress[person]={status,doneBy:status==='done'?user:'',doneAt:status==='done'?now:'',updatedBy:user,updatedAt:now}}else{t.status=status;t.owner=status==='doing'?user:t.owner;t.doneBy=status==='done'?user:'';t.doneAt=status==='done'?now:''}log('タスク更新',t.title+' / '+userName(person)+' → '+status);save();render()}
function announcementVisible(a){return a.recipients.includes(user)||a.creator===user||admin()}
function canSeeReceipts(a){return a.creator===user||(a.visibility==='admins'&&admin())||(a.visibility==='everyone'&&a.recipients.includes(user))}
function noticeActive(a){if(a.keep)return true;let cutoff=Date.now()-(data.settings.noticeRetentionDays||30)*86400000;return new Date(a.createdAt).getTime()>=cutoff}
function renderAnnouncements(){let notices=data.announcements.filter(a=>announcementVisible(a)&&noticeActive(a)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));let nf=data.noticeFilter||'all';notices=notices.filter(a=>nf==='all'||nf==='unread'&&!a.read?.[user]||nf==='read'&&a.read?.[user]||nf==='important'&&a.important||nf==='normal'&&!a.important);return `<div class="toolbar noprint">${admin()?'<button class="btn primary" id="new-announcement">＋ 業務連絡を配信</button>':''}<select id="notice-filter">${[['all','すべて'],['unread','未読'],['read','既読'],['important','重要'],['normal','通常']].map(([v,n])=>`<option value="${v}" ${nf===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="card"><h2>業務連絡・お知らせ</h2><p class="help">通常のお知らせは配信30日後に一覧から非表示になります。「残す」で保存できます。</p><div class="list">${notices.map(a=>{let read=!!a.read?.[user],ack=!!a.ack?.[user],show=canSeeReceipts(a),reads=a.recipients.filter(id=>a.read?.[id]).length;return `<div class="item notice-card ${read?'notice-read':'notice-unread'}"><div style="flex:1;min-width:0"><strong>${a.important?'🔴 重要 · ':'通常 · '}${esc(a.title)}</strong> ${a.keep?'<span class="pill">保存</span>':''} ${!read?'<span class="pill bad">未読</span>':'<span class="pill good">既読</span>'}<p>配信：${esc(userName(a.creator))} · ${stamp(a.createdAt)} ${show?' · 既読 '+reads+'/'+a.recipients.length:''}</p><div class="row"><button class="btn small" data-notice-open="${a.id}">内容を確認</button>${show?`<button class="btn small" data-notice-receipts="${a.id}">確認状況</button>`:''}</div></div></div>`}).join('')||'<p class="muted">該当するお知らせはありません。</p>'}</div></div>`}

function composeAnnouncement(){showModal('業務連絡を配信',`<div class="formgrid"><label class="field full">件名<input id="notice-title" maxlength="100"></label><label class="field full">本文<textarea id="notice-body" rows="4" maxlength="3000"></textarea></label><label class="field">既読状況の公開範囲<select id="notice-visibility"><option value="creator">作成者のみ</option><option value="admins">管理者全員</option><option value="everyone">送信先全員</option></select></label><label class="field">重要度<select id="notice-important"><option value="0">通常</option><option value="1">重要</option></select></label><label class="field full"><input type="checkbox" id="notice-keep"> 30日後も残す（自動非表示にしない）</label><label class="field full"><input type="checkbox" id="notice-with-task"> 送信先全員に確認タスクも作成する</label><label class="field">確認タスク期限<input type="date" id="notice-task-deadline"></label></div><h3>送信先 <button class="btn small" id="notice-select-all">全員選択</button> <button class="btn small" id="notice-select-none">解除</button></h3><div class="people-grid">${data.users.map(u=>`<label class="check-person"><input type="checkbox" class="pick-notice-user" value="${u.id}" checked> ${esc(u.name)}</label>`).join('')}</div>`, '<button class="btn primary" id="notice-send">配信する</button>');$('#notice-select-all').onclick=()=>$$('.pick-notice-user').forEach(e=>e.checked=true);$('#notice-select-none').onclick=()=>$$('.pick-notice-user').forEach(e=>e.checked=false);$('#notice-send').onclick=()=>{let title=$('#notice-title').value.trim(),body=$('#notice-body').value.trim(),recipients=$$('.pick-notice-user:checked').map(e=>e.value),withTask=$('#notice-with-task').checked,deadline=$('#notice-task-deadline').value;if(!title||!body||!recipients.length){alert('件名・本文・送信先が必要です。');return}if(withTask&&!deadline){alert('確認タスクの期限を指定してください。');return}let id=uid();data.announcements.push({id,title,body,creator:user,createdAt:new Date().toISOString(),recipients,visibility:$('#notice-visibility').value,important:$('#notice-important').value==='1',keep:$('#notice-keep').checked,withTask,taskDeadline:deadline,read:{},ack:{}});if(withTask)data.tasks.push({id:uid(),title:'お知らせ確認：'+title,description:body,mode:'individual',deadline,assignees:recipients,progress:{},creator:user,type:'notice',related:id,month:'all',status:'todo',createdAt:new Date().toISOString()});log('お知らせ配信',title);save();closeModal();render()}}

function openAnnouncement(id){let a=data.announcements.find(a=>a.id===id);if(!a||!announcementVisible(a))return;if(a.recipients.includes(user)){a.read??={};a.read[user]??=new Date().toISOString();save()}showModal(esc(a.title),`<p class="help">${esc(userName(a.creator))} / ${stamp(a.createdAt)}</p><div class="boxnote" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(a.body)}</div><p class="help">「確認しました」は本人がボタンを押した記録です。既読とは区別されます。</p>`,a.recipients.includes(user)&&!a.ack?.[user]?'<button class="btn primary" id="notice-ack">内容を確認しました</button>':'<span class="pill good">確認済み、または確認対象外</span>');if($('#notice-ack'))$('#notice-ack').onclick=()=>{a.ack??={};a.ack[user]=new Date().toISOString();for(const t of data.tasks.filter(t=>t.type==='notice'&&t.related===a.id&&t.assignees?.includes(user))){t.progress??={};t.progress[user]={status:'done',doneBy:user,doneAt:new Date().toISOString()}}save();closeModal();render()}}
function showReceipts(id){let a=data.announcements.find(a=>a.id===id);if(!a||!canSeeReceipts(a))return;showModal('確認状況：'+esc(a.title),`<div class="list">${a.recipients.map(id=>`<div class="item"><strong>${esc(userName(id))}</strong><div><span class="pill ${a.ack?.[id]?'good':a.read?.[id]?'warn':'bad'}">${a.ack?.[id]?'確認済み':a.read?.[id]?'既読・未確認':'未読'}</span><p>${a.ack?.[id]?'確認 '+stamp(a.ack[id]):a.read?.[id]?'既読 '+stamp(a.read[id]):''}</p></div></div>`).join('')}</div>`)}
function monthlySummary(u,s){let n=period().days.filter(d=>!!s.items[`${d}|${u.id}`]).length;return {work:n,off:period().days.length-n}}



function bindExtra(){const newTask=$('#new-task');if(newTask)newTask.onclick=newTaskModal;$$('[data-task-target]').forEach(e=>e.onchange=()=>updateTask(e.dataset.taskTarget,e.dataset.assignee,e.value));const announce=$('#new-announcement');if(announce)announce.onclick=composeAnnouncement;$$('[data-notice-open]').forEach(e=>e.onclick=()=>openAnnouncement(e.dataset.noticeOpen));$$('[data-notice-receipts]').forEach(e=>e.onclick=()=>showReceipts(e.dataset.noticeReceipts));}

$$('.nav').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;$('.mobilebar').classList.remove('open');render()}));$('#mobile-toggle').onclick=()=>$('.mobilebar').classList.toggle('open');$('#as-user').addEventListener('change',e=>{user=e.target.value;render()});render();
</script></body></html>
