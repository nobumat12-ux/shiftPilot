 return `<details class="task-details ${overdue?'task-overdue':''}"><summary><div style="min-width:0"><div class="task-title">${done===total?'✓ ':''}${taskTitle(t)} ${overdue?'<span class="pill bad">期限超過</span>':''}</div><div class="task-meta">作成：${esc(userName(t.creator))} · 期限：${t.deadline?esc(t.deadline):'指定なし'} · ${t.mode==='shared'?'共同完了':'個別完了'}</div></div><span class="task-progress">${done}/${total} 完了</span></summary><div class="task-detail-body">${t.description?`<p class="help">${esc(t.description)}</p>`:''}<div class="row">${selfButton}${myDone&&t.mode==='shared'?`<small>完了者：${esc(userName(t.doneBy))} ${stamp(t.doneAt)}</small>`:''}</div>${others}${admin()&&t.type!=='notice'?`<div class="row" style="margin-top:12px"><button class="btn small" data-edit-task="${esc(t.id)}">編集</button><button class="btn small danger" data-delete-task="${esc(t.id)}">削除</button></div>`:''}${!assigned&&!admin()?'<p class="muted">閲覧のみ</p>':''}<p class="help">基本は完了ボタンだけでOK。期日を過ぎてもタスクは消えず、未完了なら期限超過として残ります。</p></div></details>`;

function showModal(title,body,actions=''){ document.body.classList.add('modal-open');$('#modal-root').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn small" id="close-modal">✕</button></div><div class="modal-content">${body}</div><div class="modal-actions row">${actions}</div></div></div>`;$('#close-modal').onclick=closeModal;$('.modalback').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))closeModal()})}function closeModal(){$('#modal-root').innerHTML='';document.body.classList.remove('modal-open')}
function editShift(key){
 if(!admin())return;
 let [d,u]=key.split('|'),sh=getShift(),val=sh.items[key],person=data.users.find(x=>x.id===u);
 if(!person||!sh)return;
 let kind=shiftKind(val);
 showModal(`${esc(person.name)} / ${d}`,`<div class="formgrid"><label class="field full">出勤状態<select id="es-on">${Object.entries(STATUS_NAMES).map(([k,n])=>`<option value="${k}" ${kind===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">開始<input id="es-start" type="time" value="${val?.start||'17:00'}"></label><label class="field">終了<input id="es-end" type="time" value="${val?.end||'23:00'}"></label><label class="field">休憩（分）<input id="es-break" type="number" min="0" max="480" value="${val?.breakMin||0}"></label></div><p class="help">半有給は、勤務する半日の開始・終了時刻を入力してください。休暇の残日数・付与計算はこの試作版には含まれません。</p>`, '<button class="btn primary" id="save-shift">保存する</button>');
 const toggle=()=>{let enabled=['work','half'].includes($('#es-on').value);['es-start','es-end','es-break'].forEach(id=>$('#'+id).disabled=!enabled)};
 $('#es-on').onchange=toggle;toggle();
 $('#save-shift').onclick=()=>{
  let kind=$('#es-on').value,v=kind==='holiday'?null:kind==='paid'||kind==='absent'?{status:kind}:{status:kind,start:$('#es-start').value,end:$('#es-end').value,breakMin:Number($('#es-break').value)||0};
  if(isWorking(v)&&(!v.start||!v.end||v.start>=v.end)){alert('開始・終了時刻を確認してください。');return}
  sh.items[key]=v;
  log('シフト編集',`${person.name} ${d} ${shiftLabel(v)}`);
  if(sh.status==='published')newTask(`${fmt(d)} ${person.name}の変更を会社システムへ反映`,'external',key);
  save();closeModal();render();
 };
}

function composeAnnouncement(){showModal('業務連絡を配信',`<div class="formgrid"><label class="field full">件名<input id="notice-title" maxlength="100"></label><label class="field full">本文<textarea id="notice-body" rows="4" maxlength="3000"></textarea></label><label class="field">既読状況の公開範囲<select id="notice-visibility"><option value="creator">作成者のみ</option><option value="admins">管理者全員</option><option value="everyone">送信先全員</option></select></label><label class="field">重要度<select id="notice-important"><option value="0">通常</option><option value="1">重要</option></select></label><label class="field full"><input type="checkbox" id="notice-keep"> 30日後も残す（自動非表示にしない）</label><label class="field full"><input type="checkbox" id="notice-with-task"> 送信先全員に確認タスクも作成する</label><label class="field">確認タスク期限<input type="date" id="notice-task-deadline"></label></div><h3>送信先 <button class="btn small" id="notice-select-all">全員選択</button> <button class="btn small" id="notice-select-none">解除</button></h3><div class="people-grid">${data.users.map(u=>`<label class="check-person"><input type="checkbox" class="pick-notice-user" value="${u.id}" checked> ${esc(u.name)}</label>`).join('')}</div>`, '<button class="btn primary" id="notice-send">配信する</button>');$('#notice-select-all').onclick=()=>$$('.pick-notice-user').forEach(e=>e.checked=true);$('#notice-select-none').onclick=()=>$$('.pick-notice-user').forEach(e=>e.checked=false);$('#notice-send').onclick=()=>{let title=$('#notice-title').value.trim(),body=$('#notice-body').value.trim(),recipients=$$('.pick-notice-user:checked').map(e=>e.value),withTask=$('#notice-with-task').checked,deadline=$('#notice-task-deadline').value;if(!title||!body||!recipients.length){alert('件名・本文・送信先が必要です。');return}if(withTask&&!deadline){alert('確認タスクの期限を指定してください。');return}let id=uid();data.announcements.push({id,title,body,creator:user,createdAt:new Date().toISOString(),recipients,visibility:$('#notice-visibility').value,important:$('#notice-important').value==='1',keep:$('#notice-keep').checked,withTask,taskDeadline:deadline,read:{},ack:{}});if(withTask)data.tasks.push({id:uid(),title:'お知らせ確認：'+title,description:body,mode:'individual',deadline,assignees:recipients,progress:{},creator:user,type:'notice',related:id,month:'all',status:'todo',createdAt:new Date().toISOString()});log('お知らせ配信',title);save();closeModal();render()}}

function openAnnouncement(id){let a=data.announcements.find(a=>a.id===id);if(!a||!announcementVisible(a))return;if(a.recipients.includes(user)){a.read??={};a.read[user]??=new Date().toISOString();save()}showModal(esc(a.title),`<p class="help">${esc(userName(a.creator))} / ${stamp(a.createdAt)}</p><div class="boxnote" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(a.body)}</div><p class="help">「確認しました」は本人がボタンを押した記録です。既読とは区別されます。</p>`,a.recipients.includes(user)&&!a.ack?.[user]?'<button class="btn primary" id="notice-ack">内容を確認しました</button>':'<span class="pill good">確認済み、または確認対象外</span>');if($('#notice-ack'))$('#notice-ack').onclick=()=>{a.ack??={};a.ack[user]=new Date().toISOString();for(const t of data.tasks.filter(t=>t.type==='notice'&&t.related===a.id&&t.assignees?.includes(user))){t.progress??={};t.progress[user]={status:'done',doneBy:user,doneAt:new Date().toISOString()}}save();closeModal();render()}}
function showReceipts(id){let a=data.announcements.find(a=>a.id===id);if(!a||!canSeeReceipts(a))return;showModal('確認状況：'+esc(a.title),`<div class="list">${a.recipients.map(id=>`<div class="item"><strong>${esc(userName(id))}</strong><div><span class="pill ${a.ack?.[id]?'good':a.read?.[id]?'warn':'bad'}">${a.ack?.[id]?'確認済み':a.read?.[id]?'既読・未確認':'未読'}</span><p>${a.ack?.[id]?'確認 '+stamp(a.ack[id]):a.read?.[id]?'既読 '+stamp(a.read[id]):''}</p></div></div>`).join('')}</div>`)}
function monthlySummary(u,s){let n=period().days.filter(d=>isWorking(s.items[`${d}|${u.id}`])).length;return {work:n,off:period().days.length-n}}



function bindExtra(){$$('[data-quick-task]').forEach(b=>b.onclick=()=>{let t=data.tasks.find(x=>x.id===b.dataset.quickTask);if(!t||!t.assignees?.includes(user))return;let v=taskStatusFor(t)==='done'?'todo':'done';updateTask(t.id,user,v)});const newTask=$('#new-task');if(newTask)newTask.onclick=newTaskModal;const newTpl=$('#new-template');if(newTpl)newTpl.onclick=newTemplateModal;$$('[data-task-target]').forEach(e=>e.onchange=()=>updateTask(e.dataset.taskTarget,e.dataset.assignee,e.value));$$('[data-edit-template]').forEach(b=>b.onclick=()=>editTemplateModal(b.dataset.editTemplate));$$('[data-edit-task]').forEach(b=>b.onclick=()=>editTaskModal(b.dataset.editTask));$$('[data-delete-task]').forEach(b=>b.onclick=()=>deleteTask(b.dataset.deleteTask));$$('[data-staff-view]').forEach(b=>b.onclick=()=>viewStaff(b.dataset.staffView));const aw=$('#add-work');if(aw)aw.onclick=()=>addOrRenameWork();$$('[data-work-edit]').forEach(b=>b.onclick=()=>addOrRenameWork(b.dataset.workEdit));$$('[data-work-delete]').forEach(b=>b.onclick=()=>deleteWork(b.dataset.workDelete));const announce=$('#new-announcement');if(announce)announce.onclick=composeAnnouncement;$$('[data-notice-open]').forEach(e=>e.onclick=()=>openAnnouncement(e.dataset.noticeOpen));$$('[data-notice-receipts]').forEach(e=>e.onclick=()=>showReceipts(e.dataset.noticeReceipts));}

document.addEventListener('click',e=>{const el=e.target.closest('.home-mini-link[data-go]');if(!el)return;e.preventDefault();e.stopPropagation();page=el.dataset.go;render();window.scrollTo(0,0)},true);
$$('.nav').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;$('.mobilebar').classList.remove('open');render()}));const menu=$('#quick-menu'),backdrop=$('#menu-backdrop');const closeMenu=()=>{menu.classList.add('hide');backdrop.classList.add('hide')};$('#top-menu').onclick=()=>{menu.classList.toggle('hide');backdrop.classList.toggle('hide')};backdrop.onclick=closeMenu;$$('#quick-menu .nav').forEach(b=>b.addEventListener('click',closeMenu));$('#notice-bell').onclick=()=>{page='announcements';closeMenu();render()};$('#as-user').addEventListener('change',e=>{user=e.target.value;render()});render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(err=>console.warn('Service Worker登録失敗',err)));}
</script></body></html>
