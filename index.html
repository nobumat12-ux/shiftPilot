function countAt(d,t){return calc(d).entries.filter(x=>workingAt(x.s,t)).length}
function countUntil(d,t){return calc(d).entries.filter(x=>x.s.end>=t).length}
function countHeaders(){let m=data.settings.countModes;return (m.daily?'<th>日別総数</th>':'')+(m.atTime?data.settings.countTimes.map(t=>`<th>${esc(t)}時点</th>`).join(''):'')+(m.until?`<th>${esc(data.settings.untilTime)}まで</th>`:'')}
function countCells(d){let m=data.settings.countModes;return (m.daily?`<td class="count-cell">${calc(d).total}</td>`:'')+(m.atTime?data.settings.countTimes.map(t=>`<td class="count-cell">${countAt(d,t)}</td>`).join(''):'')+(m.until?`<td class="count-cell">${countUntil(d,data.settings.untilTime)}</td>`:'')}
function hourlyTable(){let days=period().days,times=Array.from({length:24},(_,i)=>`${String(i).padStart(2,'0')}:00`).filter(t=>days.some(d=>calc(d).entries.some(x=>x.s.start<=t&&x.s.end>t)));return `<div class="count-panel"><h3>時間帯別の勤務予定人数（休憩含む）</h3><div class="tablewrap"><table class="table"><thead><tr><th>日付</th>${times.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${days.map(d=>`<tr><td>${fmt(d)}</td>${times.map(t=>`<td>${countAt(d,t)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function printSheet(){let s=getShift();if(!s)return '';let ds=period().days,cols=data.users,mode=data.settings.vertical==='dates';let heads=mode?cols.map(u=>u.name):ds.map(d=>fmt(d)),rows=mode?ds:cols;let h=`<tr><th>${mode?'日付':'スタッフ'}</th>${heads.map(x=>`<th>${esc(x)}</th>`).join('')}${mode?countHeaders():'<th>出勤</th><th>休日</th>'}</tr>`;let body=rows.map(r=>`<tr><th>${mode?fmt(r):esc(r.name)}</th>${(mode?cols:ds).map(c=>{let d=mode?r:c,u=mode?c:r,v=s.items[`${d}|${u.id}`];return `<td>${v?`${v.start.replace(':','')}-${v.end.replace(':','')}`:'休'}</td>`}).join('')}${mode?countCells(r):`<td>${monthlySummary(r,s).work}</td><td>${monthlySummary(r,s).off}</td>`}</tr>`).join('');if(mode)body+=`<tr><th>出勤</th>${cols.map(u=>`<td>${monthlySummary(u,s).work}</td>`).join('')}</tr><tr><th>休日</th>${cols.map(u=>`<td>${monthlySummary(u,s).off}</td>`).join('')}</tr>`;let cells=heads.length+1+(mode?(data.settings.countModes.daily?1:0)+(data.settings.countModes.atTime?data.settings.countTimes.length:0)+(data.settings.countModes.until?1:0):2);return `<div class="print-sheet" style="--print-font:${cells>29?5:cells>22?6:7}px"><h2>${esc(month)} 月間シフト</h2><p>サンプル部門 · ${fmt(ds[0])}〜${fmt(ds.at(-1))} · 印刷日 ${today} · ${s.status==='published'?'公開済み':'下書き'}</p><table>${h}${body}</table></div>`}

function renderShifts(){let s=getShift(),{days}=period(),vertical=data.settings.vertical==='dates',head=vertical?data.users.map(u=>u.name):days.map(d=>`${fmt(d)} ${weekday(d)}`),rows=vertical?days:data.users.map(u=>u.id);let html=s?`<div class="tablewrap"><table class="table"><thead><tr><th>${vertical?'日付':'スタッフ'}</th>${head.map(x=>`<th>${esc(x)}</th>`).join('')}${vertical?countHeaders():''}${vertical&&data.settings.showLeader?'<th>リーダー</th>':''}${!vertical?'<th>出勤</th><th>休日</th>':''}</tr></thead><tbody>${rows.map(v=>{let d=vertical?v:null,u=vertical?null:data.users.find(x=>x.id===v);let sum=!vertical?monthlySummary(u,s):null;return `<tr><td>${vertical?`${fmt(v)}（${weekday(v)}）`:esc(u.name)}</td>${(vertical?data.users:days).map(a=>{let dt=vertical?d:a,usr=vertical?a:u,key=`${dt}|${usr.id}`,sh=s.items[key],label=sh?`${sh.start}–${sh.end}${data.settings.showBreak&&sh.breakMin?` / 休${sh.breakMin}`:''}`:'休',changed=isChanged(key);return `<td><button class="shift ${sh?'':'off'} ${changed?'changed':''}" data-edit="${key}" title="${esc(usr.name)} ${dt}">${changed?'● ':''}${label}</button></td>`}).join('')}${vertical?countCells(d):''}${vertical&&data.settings.showLeader?`<td>${calc(d).leaders}</td>`:''}${!vertical?`<td class="count-cell">${sum.work}日</td><td class="count-cell">${sum.off}日</td>`:''}</tr>`}).join('')}${vertical?`<tr class="totals-row"><td>出勤日数</td>${data.users.map(u=>`<td>${monthlySummary(u,s).work}日</td>`).join('')}<td colspan="${(data.settings.countModes.daily?1:0)+(data.settings.countModes.atTime?data.settings.countTimes.length:0)+(data.settings.countModes.until?1:0)+(data.settings.showLeader?1:0)}"></td></tr><tr class="totals-row"><td>休日数</td>${data.users.map(u=>`<td>${monthlySummary(u,s).off}日</td>`).join('')}<td colspan="${(data.settings.countModes.daily?1:0)+(data.settings.countModes.atTime?data.settings.countTimes.length:0)+(data.settings.countModes.until?1:0)+(data.settings.showLeader?1:0)}"></td></tr>`:''}</tbody></table></div>`:'<div class="boxnote">この月のシフトはまだありません。「契約・希望から下書きを作成」を押してください。</div>';return `<div class="toolbar noprint"><input type="month" id="month" value="${month}"><span class="pill ${s?.status==='published'?'good':'warn'}">${s?(s.status==='published'?'公開済み':'下書き'):'未作成'}</span><select id="orientation"><option value="dates" ${vertical?'selected':''}>日付を縦</option><option value="staff" ${!vertical?'selected':''}>スタッフを縦</option></select>${admin()?`<button class="btn primary" id="generate">${s?'下書きを再生成':'契約・希望から下書きを作成'}</button>${s&&s.status!=='published'?'<button class="btn" id="publish">シフトを公開</button>':''}`:''}${s?'<button class="btn" id="csv">CSV出力</button><button class="btn" id="print">印刷 / PDF保存</button>':''}</div><div class="card"><div class="row noprint" style="justify-content:space-between"><h2>${month} 月間シフト</h2><span class="muted">${fmt(days[0])}〜${fmt(days.at(-1))} / 赤字●＝公開後の変更</span></div>${html}${s&&data.settings.countModes.hourly?hourlyTable():''}</div>${s?printSheet():''}${admin()&&s?`<div class="card" style="margin-top:15px"><h2>シフト編集履歴</h2><div class="list">${data.history.filter(h=>h.action.includes('シフト')||h.action.includes('公開')||h.action.includes('下書き')).slice(0,8).map(h=>`<div class="item"><span>${esc(h.detail)}</span><span class="muted">${esc(h.by)} · ${stamp(h.at)}</span></div>`).join('')||'履歴なし'}</div></div>`:''}`}

const submissionKey=(m=month,u=user)=>`${m}|${u}`;
const draftFor=(m=month,u=user)=>data.requestDrafts[submissionKey(m,u)]||{};
function renderRequests(){let arr=requestsFor(),mine=arr.filter(r=>r.user===user),{days}=period(),draft=draftFor(),submitted=!!data.requestSubmissions[submissionKey()],weekOffset=new Date(days[0]+'T12:00:00').getDay();let cards=Array.from({length:weekOffset},()=>'<div></div>').join('')+days.map(d=>{let c=me().contracts[new Date(d+'T12:00:00').getDay()],r=draft[d],label=r?.type==='unavailable'?'出勤不可':r?.type==='time'?`変更 ${r.start}〜${r.end}`:r?.type==='available'?`追加可能 ${r.start}〜${r.end}`:r?.type==='none'?'契約通り':c?`${c[0]}〜${c[1]}`:'契約休';return `<button class="day ${r&&r.type!=='none'?'modified':''}" data-request-day="${d}"><span class="date">${+d.slice(-2)}（${weekday(d)}）</span><span class="hour">${esc(label)}</span>${r&&r.type!=='none'?'<span class="hint">● 希望変更</span>':''}</button>`}).join('');return `<div class="toolbar"><input type="month" id="month" value="${month}"><span class="pill ${submitted?'good':'warn'}">${submitted?'提出済み':'未提出'}</span></div><div class="card"><h2>自分の希望提出カレンダー</h2><p class="help">週契約があらかじめ反映されています。変更したい日をタップし、最後に「今月の希望を提出」を押してください。提出後も再編集できます。</p><div class="calendar">${['日','月','火','水','木','金','土'].map(x=>`<div class="dayheading">${x}</div>`).join('')}${cards}</div><div class="summarystrip"><span class="pill">契約を初期表示</span><span class="pill bad">赤：変更した希望</span></div><div class="row noprint"><button class="btn" id="save-request-draft">下書き保存</button><button class="btn primary" id="submit-month-request">${submitted?'変更して再提出':'今月の希望を提出'}</button></div><p class="help">入力中はこの端末に自動保持されます。正式提出後に管理者が確認できます。</p></div><div class="card" style="margin-top:15px"><h2>提出状況</h2><div class="list">${data.users.map(u=>{let done=!!data.requestSubmissions[submissionKey(month,u.id)]||arr.some(r=>r.user===u.id);return `<div class="item"><span>${esc(u.name)}</span><span class="pill ${done?'good':'warn'}">${done?'提出済み':'未提出'}</span></div>`}).join('')}</div></div>${admin()?`<div class="card" style="margin-top:15px"><h2>提出された希望（管理者用）</h2><div class="list">${arr.slice().reverse().map(r=>`<div class="item"><div><b>${esc(data.users.find(u=>u.id===r.user)?.name)} / ${fmt(r.date)}</b><p>${esc(requestLabel(r))}</p></div><span class="muted">${new Date(r.at).toLocaleString('ja-JP')}</span></div>`).join('')||'希望変更はありません'}</div></div>`:''}`}
function requestLabel(r){return ({unavailable:'出勤不可',time:`勤務時間変更 ${r.start||'—'}〜${r.end||'—'}`,available:`追加勤務可能 ${r.start||'—'}〜${r.end||'—'}`,none:'契約通り'})[r.type]||r.type}
function editRequestDay(d){let c=me().contracts[new Date(d+'T12:00:00').getDay()],r=draftFor()[d];showModal(`${fmt(d)}（${weekday(d)}）の希望`,`<p class="boxnote">契約：${c?c[0]+'〜'+c[1]+' / 休憩'+c[2]+'分':'契約休'}</p><div class="formgrid"><label class="field full">希望区分<select id="r-type"><option value="none" ${!r||r.type==='none'?'selected':''}>契約通り（希望変更なし）</option><option value="unavailable" ${r?.type==='unavailable'?'selected':''}>出勤不可</option><option value="time" ${r?.type==='time'?'selected':''}>勤務時間を変更したい</option><option value="available" ${r?.type==='available'?'selected':''}>追加勤務可能</option></select></label><label class="field">希望開始<input type="time" id="r-start" value="${r?.start||c?.[0]||'17:00'}"></label><label class="field">希望終了<input type="time" id="r-end" value="${r?.end||c?.[1]||'23:00'}"></label></div>`,'<button class="btn primary" id="save-request-day">この日の希望を保存</button>');$('#save-request-day').onclick=()=>{let type=$('#r-type').value,start=$('#r-start').value,end=$('#r-end').value;if(['time','available'].includes(type)&&(!start||!end||start>=end)){alert('希望時間を確認してください');return}let key=submissionKey();data.requestDrafts[key]??={};if(type==='none')delete data.requestDrafts[key][d];else data.requestDrafts[key][d]={type,start,end};save();closeModal();render()}}
function submitMonthRequests(){let key=submissionKey(),draft=draftFor(),old=data.requests.filter(r=>r.month===month&&r.user===user),latest={};old.forEach(r=>latest[r.date]=r);let dates=new Set([...Object.keys(draft),...Object.keys(latest)]);for(let d of dates){let r=draft[d]||{type:'none',start:'',end:''},prev=latest[d];if(!prev&&r.type==='none')continue;if(prev&&prev.type===r.type&&(prev.start||'')===(r.start||'')&&(prev.end||'')===(r.end||''))continue;addRequest({month,date:d,user,type:r.type,start:r.start||'',end:r.end||''})}data.requestSubmissions[key]=new Date().toISOString();log('希望月間提出',`${me().name} ${month}`);save();render();alert('今月の希望を提出しました。')}

function renderTasks(){const tasks=visibleTasks().filter(t=>t.month===month||t.month==='all').sort((a,b)=>Number(taskStatusFor(a)==='done')-Number(taskStatusFor(b)==='done'));
 return `<div class="toolbar noprint"><input type="month" id="month" value="${month}">${admin()?'<button class="btn primary" id="new-task">＋ タスクを一括作成</button>':''}<span class="pill">自分の未完了：${pendingMine().length}件</span></div><div class="card"><h2>${admin()?'部門のタスク・担当者別進捗':'自分のタスク'}</h2><p class="help">「個人別」は全員がそれぞれ完了、「共同」は誰か1人が完了すれば終了。完了者・日時を記録します。</p><div class="list">${tasks.map(t=>{normalizeTask(t);let selfAssigned=t.assignees.includes(user);return `<div class="item task-card"><div style="flex:1;min-width:0"><div class="row"><strong>${taskStatusFor(t)==='done'?'✅':'☐'} ${taskTitle(t)}</strong><span class="pill ${t.mode==='individual'?'':'warn'}">${t.mode==='individual'?'個人別':'共同'}</span></div><p>作成：${esc(userName(t.creator))}　·　${progressLabel(t)}　${t.deadline?'· 期限 '+esc(t.deadline):''}</p>${t.description?`<p>${esc(t.description)}</p>`:''}${t.mode==='individual'&&admin()?`<div class="assignee-grid">${t.assignees.map(id=>`<div class="assignee-row"><b>${esc(userName(id))}</b>${taskStatusPicker(t,id,true)}<small>${t.progress[id]?.status==='done'?`✓ ${esc(userName(t.progress[id].doneBy))} / ${stamp(t.progress[id].doneAt)}`:''}</small></div>`).join('')}</div>`:t.mode==='individual'&&selfAssigned?`<div class="row">${taskStatusPicker(t,user,true)}<small class="muted">${t.progress[user]?.status==='done'?`完了 ${stamp(t.progress[user].doneAt)}`:''}</small></div>`:t.mode==='shared'?`<div class="row">${taskStatusPicker(t,user,admin()||selfAssigned)}<small class="muted">${t.doneBy?'完了者 '+esc(userName(t.doneBy))+' / '+stamp(t.doneAt):'対象 '+t.assignees.map(userName).map(esc).join('、')}</small></div>`:''}</div></div>`}).join('')||'<div class="muted">該当するタスクはありません。</div>'}</div></div>${admin()?`<div class="card" style="margin-top:15px"><h2>月次タスクのテンプレート</h2><p class="help">シフト公開時に共同タスクが自動作成されます。個人別の依頼は新規タスクから作成できます。</p><div class="list">${data.taskTemplates.map(t=>`<div class="item"><span>${esc(t.title)}</span><button class="btn small danger" data-delete-template="${t.id}">削除</button></div>`).join('')}</div><div class="row" style="margin-top:14px"><input id="template-title" placeholder="毎月必要なタスク名" style="flex:1"><button class="btn" id="add-template">追加</button></div></div>`:''}`
}

function renderStaff(){return `<div class="card"><div class="row" style="justify-content:space-between"><h2>スタッフと週契約</h2>${admin()?'<button class="btn primary" id="add-staff">＋ スタッフを登録</button>':''}</div><div class="list">${data.users.filter(u=>admin()||u.id===user).map(u=>`<div class="item"><div><strong>${esc(u.name)}</strong> <span class="pill">${u.role==='admin'?'管理者':'一般'}</span> ${u.leader?'<span class="pill">リーダー</span>':''} ${u.key?'<span class="pill good">鍵所持</span>':''}<p>社員番号 ${esc(u.code)}　/　可能業務：${esc(u.skills.join('・')||'未登録')}</p><p>契約：${Object.entries(u.contracts).map(([d,c])=>`${['日','月','火','水','木','金','土'][d]} ${c[0]}〜${c[1]}`).join(' / ')||'未登録'}</p></div>${admin()?`<button class="btn small" data-staff="${u.id}">編集</button>`:''}</div>`).join('')}</div></div>`}
function renderSettings(){let modes=data.settings.countModes;return `<div class="card"><h2>部門設定</h2><p class="help">集計の表示方式は組み合わせ自由。休憩時刻が未登録のため人数は休憩を差し引かない勤務予定人数です。</p><div class="formgrid"><label class="field">シフト開始日<input id="start-day" type="number" min="1" max="28" value="${data.settings.startDay}" ${!admin()?'disabled':''}></label><label class="field">管理者のタスク操作<select id="task-policy" ${!admin()?'disabled':''}><option value="all">全管理者（試作版）</option><option value="selected" ${data.settings.taskPolicy==='selected'?'selected':''}>指定管理者（正式版で実装）</option></select></label><label class="field">指定時刻まで勤務する人数：基準時刻<input type="time" id="until-time" value="${data.settings.untilTime}" ${!admin()?'disabled':''}></label><label class="field">基準時刻人数：複数時刻をカンマで区切る<input id="count-times" value="${esc(data.settings.countTimes.join(', '))}" placeholder="12:00, 17:00" ${!admin()?'disabled':''}></label><label class="field">スマホメニュー<select id="mobile-nav"><option value="tabs" ${data.settings.mobileNav==='tabs'?'selected':''}>下部タブ</option><option value="hamburger" ${data.settings.mobileNav==='hamburger'?'selected':''}>三本線メニュー</option></select></label><label class="field">リーダー人数<select id="show-leader"><option value="true" ${data.settings.showLeader?'selected':''}>表示</option><option value="false" ${!data.settings.showLeader?'selected':''}>非表示</option></select></label><label class="field">休憩時間の表示<select id="show-break"><option value="true" ${data.settings.showBreak?'selected':''}>表示</option><option value="false" ${!data.settings.showBreak?'selected':''}>非表示</option></select></label></div><h3>人数の集計表示</h3><div class="row">${[['daily','日別出勤人数'],['atTime','指定時刻に勤務中の人数'],['until','指定時刻まで勤務する人数'],['hourly','時間帯別人数']].map(([k,v])=>`<label class="pill"><input type="checkbox" data-count-mode="${k}" ${modes[k]?'checked':''} ${!admin()?'disabled':''}> ${v}</label>`).join('')}</div><p class="help">「指定時刻まで」は退勤がその時刻以降の人を数えます。時間帯別は1時間単位です。</p>${admin()?'<div class="spacer"></div><button class="btn primary" id="save-settings">設定を保存</button>':''}</div><div class="card" style="margin-top:16px"><h2>試作データ</h2><p class="help">データはブラウザにのみ保存。実際の社員情報は入力しないでください。</p><button class="btn danger" id="reset">サンプルに戻す</button></div>`}

function showModal(title,body,actions=''){ $('#modal-root').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn small" id="close-modal">✕</button></div>${body}<div class="row" style="justify-content:flex-end;margin-top:19px">${actions}</div></div></div>`;$('#close-modal').onclick=closeModal;$('.modalback').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))closeModal()})}function closeModal(){$('#modal-root').innerHTML=''}
function editShift(key){if(!admin())return;let [d,u]=key.split('|'),sh=getShift(),val=sh.items[key],person=data.users.find(x=>x.id===u);showModal(`${esc(person.name)} / ${d}`,`<div class="formgrid"><label class="field">勤務状態<select id="es-on"><option value="work" ${val?'selected':''}>出勤</option><option value="off" ${!val?'selected':''}>休み</option></select></label><label class="field">休憩（分）<input id="es-break" type="number" min="0" max="480" value="${val?.breakMin||0}"></label><label class="field">開始<input id="es-start" type="time" value="${val?.start||'17:00'}"></label><label class="field">終了<input id="es-end" type="time" value="${val?.end||'23:00'}"></label></div>`, '<button class="btn primary" id="save-shift">保存</button>');$('#save-shift').onclick=()=>{let val=$('#es-on').value==='off'?null:{start:$('#es-start').value,end:$('#es-end').value,breakMin:+$('#es-break').value};if(val&&(!val.start||!val.end||val.start>=val.end)){alert('開始・終了時刻を確認してください。');return}sh.items[key]=val;log('シフト編集',`${person.name} ${d} ${val?val.start+'〜'+val.end:'休み'}`);if(sh.status==='published')newTask(`${fmt(d)} ${person.name}の変更を会社システムへ反映`,'external',key);save();closeModal();render()}}
function newRequest(){page="requests";render()}
function staffModal(id){if(!admin())return;let u=data.users.find(x=>x.id===id),newbie=!u,u0=u||{name:'',code:'',role:'staff',leader:false,key:false,skills:[],contracts:{}};showModal(newbie?'スタッフを登録':'スタッフ編集',`<div class="formgrid"><label class="field">氏名<input id="st-name" value="${esc(u0.name)}"></label><label class="field">社員番号（試作用）<input id="st-code" value="${esc(u0.code)}"></label><label class="field">区分<select id="st-role"><option value="staff" ${u0.role==='staff'?'selected':''}>一般スタッフ</option><option value="admin" ${u0.role==='admin'?'selected':''}>管理者</option></select></label><label class="field">可能業務（カンマ区切り）<input id="st-skills" value="${esc(u0.skills.join(','))}"></label><label><input type="checkbox" id="st-leader" ${u0.leader?'checked':''}> リーダー</label><label><input type="checkbox" id="st-key" ${u0.key?'checked':''}> 鍵所持</label></div><h3>曜日別の週契約</h3><div class="list">${['日','月','火','水','木','金','土'].map((w,d)=>{let c=u0.contracts[d];return `<div class="row"><label style="width:45px"><input type="checkbox" data-day="${d}" ${c?'checked':''}> ${w}</label><input type="time" id="cs${d}" value="${c?.[0]||'17:00'}"><span>〜</span><input type="time" id="ce${d}" value="${c?.[1]||'23:00'}"><span class="muted" style="font-size:11px">休憩(分)</span><input type="number" min="0" max="480" id="cb${d}" title="休憩分" style="width:75px" value="${c?.[2]||0}"></div>`}).join('')}</div>`, '<button class="btn primary" id="save-staff">保存</button>');$('#save-staff').onclick=()=>{let n=$('#st-name').value.trim(),code=$('#st-code').value.trim();if(!n||!code){alert('氏名と番号を入力してください');return}let contracts={};for(let d=0;d<7;d++)if($(`[data-day="${d}"]`).checked){let a=$(`#cs${d}`).value,b=$(`#ce${d}`).value;if(!a||!b||a>=b){alert('契約の時刻を確認してください');return}contracts[d]=[a,b,$(`#cb${d}`).value]}let val={id:id||uid(),name:n,code,role:$('#st-role').value,leader:$('#st-leader').checked,key:$('#st-key').checked,skills:$('#st-skills').value.split(',').map(s=>s.trim()).filter(Boolean),contracts};if(newbie)data.users.push(val);else Object.assign(u,val);log('スタッフ管理',n+' の登録・更新');save();closeModal();render()}}
function exportCsv(){let s=getShift();if(!s)return;let lines=[['日付','スタッフ','開始','終了','休憩(分)','状態']];for(let d of period().days)for(let u of data.users){let v=s.items[`${d}|${u.id}`];lines.push([d,u.name,v?.start||'',v?.end||'',v?.breakMin??'',v?'出勤':'休み'])}let csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`shift_${month}.csv`;a.click();URL.revokeObjectURL(url)}
function bind(){const go=(id,fn)=>{let x=$('#'+id);if(x)x.onclick=fn};$$('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});go('month',()=>{});if($('#month'))$('#month').onchange=e=>{month=e.target.value;render()};if($('#orientation'))$('#orientation').onchange=e=>{data.settings.vertical=e.target.value;save();render()};go('generate',()=>{let s=getShift();if(s?.status==='published'){alert('公開済みのシフトは再生成できません。');return}let unsubmitted=data.users.filter(u=>!data.requestSubmissions[submissionKey(month,u.id)]&&!requestsFor().some(r=>r.user===u.id));let msg=`${month}の下書きを${s?'再':'新規'}生成します。${s?'現在の下書き編集内容は上書きされます。\n':''}${unsubmitted.length?'\n希望未提出：'+unsubmitted.map(u=>u.name).join('、'):''}`;if(confirm(msg)){buildShift();render()}});go('publish',()=>{let pending=data.tasks.filter(t=>t.month===month&&t.type==='request'&&t.status!=='done');if(pending.length){alert(`希望変更に関する未完了タスクが${pending.length}件あります。確認・完了してから公開してください。`);return}if(!confirm('この月のシフトを全スタッフ向けに公開した状態にしますか？'))return;let s=getShift();s.status='published';s.baseline=structuredClone(s.items);data.taskTemplates.forEach(t=>newTask(`${month}：${t.title}`,'manual','',month));log('シフト公開',`${month} を公開`);save();render()});go('csv',exportCsv);go('print',()=>window.print());$$('[data-edit]').forEach(b=>b.onclick=()=>editShift(b.dataset.edit));go('new-request',newRequest);$$('[data-request-day]').forEach(b=>b.onclick=()=>editRequestDay(b.dataset.requestDay));go('save-request-draft',()=>{save();alert('下書きを保存しました。')});go('submit-month-request',submitMonthRequests);go('new-task',()=>showModal('タスク追加','<label class="field">内容<input id="newtask-title" placeholder="例：会社システムに反映する"></label>','<button class="btn primary" id="make-task">追加</button>')||($('#make-task').onclick=()=>{let t=$('#newtask-title').value.trim();if(!t)return;newTask(t);save();closeModal();render()}));$$('[data-task-status]').forEach(sel=>sel.onchange=e=>{let t=data.tasks.find(x=>x.id===sel.dataset.taskStatus);t.status=e.target.value;if(t.status==='done'){t.doneBy=user;t.doneAt=new Date().toISOString()}else{t.doneBy='';t.doneAt='';if(t.status==='doing')t.owner=user}log('タスク更新',t.title+' → '+({todo:'未対応',doing:'対応中',done:'完了'}[t.status]));save();render()});go('add-template',()=>{let n=$('#template-title').value.trim();if(n){data.taskTemplates.push({id:uid(),title:n});save();render()}});$$('[data-delete-template]').forEach(b=>b.onclick=()=>{if(confirm('テンプレートを削除しますか？')){data.taskTemplates=data.taskTemplates.filter(t=>t.id!==b.dataset.deleteTemplate);save();render()}});go('add-staff',()=>staffModal());$$('[data-staff]').forEach(b=>b.onclick=()=>staffModal(b.dataset.staff));go('save-settings',()=>{if(!admin())return;data.settings.startDay=Math.min(28,Math.max(1,+$('#start-day').value||1));data.settings.taskPolicy=$('#task-policy').value;data.settings.showLeader=$('#show-leader').value==='true';data.settings.showBreak=$('#show-break').value==='true';data.settings.untilTime=$('#until-time').value||'23:00';data.settings.countTimes=[...new Set($('#count-times').value.split(/[,、\s]+/).map(x=>x.trim()).filter(x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x)))].slice(0,5);if(!data.settings.countTimes.length)data.settings.countTimes=['22:30'];$$('[data-count-mode]').forEach(x=>data.settings.countModes[x.dataset.countMode]=x.checked);data.settings.mobileNav=$('#mobile-nav').value;save();render();alert('設定を保存しました')});go('reset',()=>{if(confirm('試作データをすべて初期化しますか？')){data=demo();save();month=currentMonth;user='u1';render()}});bindExtra()}
// v0.3: 個別・共同タスク / 部門お知らせ。試作版は端末内データのみ。
const userName=id=>data.users.find(u=>u.id===id)?.name||'不明なスタッフ';
const stamp=isoString=>isoString?new Date(isoString).toLocaleString('ja-JP'):'—';
const taskTitle=t=>esc(t.title);
function normalizeTask(t){if(!t.mode)t.mode='shared';if(!Array.isArray(t.assignees))t.assignees=data.users.filter(u=>u.role==='admin').map(u=>u.id);if(!t.progress)t.progress={};if(!t.creator)t.creator='u1';return t}
function taskVisible(t){normalizeTask(t);return admin()||t.assignees.includes(user)}
function taskCanEdit(t){normalizeTask(t);return admin()||t.assignees.includes(user)}
function taskStatusFor(t,id=user){normalizeTask(t);return t.mode==='individual'?(t.progress[id]?.status||'todo'):t.status}
function visibleTasks(){return data.tasks.filter(t=>taskVisible(t))}
function pendingMine(){return visibleTasks().filter(t=>t.assignees.includes(user)&&taskStatusFor(t)!=='done')}
function taskStatusPicker(t,id,allow){let v=t.mode==='individual'?(t.progress[id]?.status||'todo'):t.status;return `<select aria-label="${esc(userName(id))}の進捗" data-task-target="${esc(t.id)}" data-assignee="${esc(id)}" ${!allow?'disabled':''}><option value="todo" ${v==='todo'?'selected':''}>☐ 未対応</option><option value="doing" ${v==='doing'?'selected':''}>◐ 対応中</option><option value="done" ${v==='done'?'selected':''}>✓ 完了</option></select>`}
function progressLabel(t){normalizeTask(t);if(t.mode==='individual'){let total=t.assignees.length,done=t.assignees.filter(id=>t.progress[id]?.status==='done').length;return `${done}/${total}人 完了`};return t.status==='done'?`完了：${esc(userName(t.doneBy))}`:t.status==='doing'?'対応中':'未対応'}

function newTaskModal(){const options=data.users.map(u=>`<label class="check-person"><input type="checkbox" class="pick-task-user" value="${u.id}" checked> ${esc(u.name)} <small>${u.role==='admin'?'管理者':'スタッフ'}</small></label>`).join('');showModal('タスクの一括作成',`<div class="formgrid"><label class="field full">タスク名<input id="task-new-title" maxlength="100" placeholder="例：新しいマニュアルを確認"></label><label class="field full">詳細（任意）<textarea id="task-new-detail" rows="3" maxlength="1000"></textarea></label><label class="field">完了方式<select id="task-new-mode"><option value="individual">各人が個別に完了</option><option value="shared">誰か1人が完了すれば終了</option></select></label><label class="field">期限（任意）<input id="task-new-deadline" type="date"></label></div><h3>対象者 <button class="btn small" id="task-select-all">全員選択</button> <button class="btn small" id="task-select-none">すべて解除</button></h3><div class="people-grid">${options}</div>`, '<button class="btn primary" id="task-create">対象者に作成</button>');$('#task-select-all').onclick=()=>$$('.pick-task-user').forEach(e=>e.checked=true);$('#task-select-none').onclick=()=>$$('.pick-task-user').forEach(e=>e.checked=false);$('#task-create').onclick=()=>{let title=$('#task-new-title').value.trim(),assignees=$$('.pick-task-user:checked').map(e=>e.value);if(!title||!assignees.length){alert('タスク名と対象者を入力してください。');return}let t={id:uid(),title,description:$('#task-new-detail').value.trim(),mode:$('#task-new-mode').value,deadline:$('#task-new-deadline').value,assignees,progress:{},creator:user,type:'manual',related:'',month,status:'todo',owner:'',doneBy:'',doneAt:'',createdAt:new Date().toISOString()};data.tasks.push(t);log('タスク作成',title+'（'+assignees.length+'人）');save();closeModal();render()}}
function updateTask(id,person,status){let t=data.tasks.find(x=>x.id===id);if(!t)return;normalizeTask(t);if(!admin()&&!t.assignees.includes(user))return;if(!admin()&&person!==user)return;const now=new Date().toISOString();if(t.mode==='individual'){t.progress[person]={status,doneBy:status==='done'?user:'',doneAt:status==='done'?now:'',updatedBy:user,updatedAt:now}}else{t.status=status;t.owner=status==='doing'?user:t.owner;t.doneBy=status==='done'?user:'';t.doneAt=status==='done'?now:''}log('タスク更新',t.title+' / '+userName(person)+' → '+status);save();render()}
function announcementVisible(a){return a.recipients.includes(user)||a.creator===user||admin()}
function canSeeReceipts(a){return a.creator===user||(a.visibility==='admins'&&admin())||(a.visibility==='everyone'&&a.recipients.includes(user))}
function renderAnnouncements(){let notices=data.announcements.filter(announcementVisible).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `<div class="toolbar noprint">${admin()?'<button class="btn primary" id="new-announcement">＋ 業務連絡を配信</button>':''}<span class="pill">未確認：${data.announcements.filter(a=>a.recipients.includes(user)&&!a.ack?.[user]).length}件</span></div><div class="card"><h2>業務連絡・お知らせ</h2><p class="help">個別チャットはありません。部門内の連絡を配信し、既読と「確認しました」を記録します。</p><div class="list">${notices.map(a=>{let isRecipient=a.recipients.includes(user),read=!!a.read?.[user],ack=!!a.ack?.[user],show=canSeeReceipts(a);let acked=a.recipients.filter(id=>a.ack?.[id]).length,reads=a.recipients.filter(id=>a.read?.[id]).length;return `<div class="item notice-card"><div style="flex:1;min-width:0"><div class="row"><strong>${a.important?'🔴 ':''}${esc(a.title)}</strong>${isRecipient&&!ack?'<span class="pill bad">未確認</span>':isRecipient?'<span class="pill good">確認済み</span>':''}</div><p>配信：${esc(userName(a.creator))} · ${stamp(a.createdAt)} ${show?` · 既読${reads}/${a.recipients.length}・確認${acked}/${a.recipients.length}`:''}</p><p class="notice-preview">${esc(a.body)}</p><div class="row"><button class="btn small" data-notice-open="${a.id}">詳細を見る${!read&&isRecipient?' ●':''}</button>${show?`<button class="btn small" data-notice-receipts="${a.id}">確認状況</button>`:''}</div></div></div>`}).join('')||'<p class="muted">まだお知らせはありません。</p>'}</div></div>`}
function composeAnnouncement(){showModal('業務連絡を配信',`<div class="formgrid"><label class="field full">件名<input id="notice-title" maxlength="100" placeholder="例：来月のシフト確認について"></label><label class="field full">本文<textarea id="notice-body" rows="5" maxlength="3000" placeholder="連絡内容を入力"></textarea></label><label class="field">既読状況の公開範囲<select id="notice-visibility"><option value="creator">作成者のみ</option><option value="admins">管理者全員</option><option value="everyone">送信先全員</option></select></label><label class="field">重要度<label><input type="checkbox" id="notice-important"> 重要なお知らせ</label></label></div><h3>送信先 <button class="btn small" id="notice-select-all">部門全員</button> <button class="btn small" id="notice-select-none">解除</button></h3><div class="people-grid">${data.users.map(u=>`<label class="check-person"><input type="checkbox" class="pick-notice-user" value="${u.id}" checked> ${esc(u.name)}</label>`).join('')}</div>`, '<button class="btn primary" id="notice-send">送信する</button>');$('#notice-select-all').onclick=()=>$$('.pick-notice-user').forEach(e=>e.checked=true);$('#notice-select-none').onclick=()=>$$('.pick-notice-user').forEach(e=>e.checked=false);$('#notice-send').onclick=()=>{let title=$('#notice-title').value.trim(),body=$('#notice-body').value.trim(),recipients=$$('.pick-notice-user:checked').map(e=>e.value);if(!title||!body||!recipients.length){alert('件名・本文・送信先が必要です。');return}data.announcements.push({id:uid(),title,body,creator:user,createdAt:new Date().toISOString(),recipients,visibility:$('#notice-visibility').value,important:$('#notice-important').checked,read:{},ack:{}});log('お知らせ配信',title);save();closeModal();render()}}
function openAnnouncement(id){let a=data.announcements.find(a=>a.id===id);if(!a||!announcementVisible(a))return;if(a.recipients.includes(user)){a.read??={};a.read[user]??=new Date().toISOString();save()}showModal(esc(a.title),`<p class="help">${esc(userName(a.creator))} / ${stamp(a.createdAt)}</p><div class="boxnote" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(a.body)}</div><p class="help">「確認しました」は本人がボタンを押した記録です。既読とは区別されます。</p>`,a.recipients.includes(user)&&!a.ack?.[user]?'<button class="btn primary" id="notice-ack">内容を確認しました</button>':'<span class="pill good">確認済み、または確認対象外</span>');if($('#notice-ack'))$('#notice-ack').onclick=()=>{a.ack??={};a.ack[user]=new Date().toISOString();save();closeModal();render()}}
function showReceipts(id){let a=data.announcements.find(a=>a.id===id);if(!a||!canSeeReceipts(a))return;showModal('確認状況：'+esc(a.title),`<div class="list">${a.recipients.map(id=>`<div class="item"><strong>${esc(userName(id))}</strong><div><span class="pill ${a.ack?.[id]?'good':a.read?.[id]?'warn':'bad'}">${a.ack?.[id]?'確認済み':a.read?.[id]?'既読・未確認':'未読'}</span><p>${a.ack?.[id]?'確認 '+stamp(a.ack[id]):a.read?.[id]?'既読 '+stamp(a.read[id]):''}</p></div></div>`).join('')}</div>`)}
function monthlySummary(u,s){let n=period().days.filter(d=>!!s.items[`${d}|${u.id}`]).length;return {work:n,off:period().days.length-n}}



function bindExtra(){const newTask=$('#new-task');if(newTask)newTask.onclick=newTaskModal;$$('[data-task-target]').forEach(e=>e.onchange=()=>updateTask(e.dataset.taskTarget,e.dataset.assignee,e.value));const announce=$('#new-announcement');if(announce)announce.onclick=composeAnnouncement;$$('[data-notice-open]').forEach(e=>e.onclick=()=>openAnnouncement(e.dataset.noticeOpen));$$('[data-notice-receipts]').forEach(e=>e.onclick=()=>showReceipts(e.dataset.noticeReceipts));}

$$('.nav').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;$('.mobilebar').classList.remove('open');render()}));$('#mobile-toggle').onclick=()=>$('.mobilebar').classList.toggle('open');$('#as-user').addEventListener('change',e=>{user=e.target.value;render()});render();
